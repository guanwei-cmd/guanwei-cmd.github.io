Hei',sans-serif;font-size:14.5px;font-weight:500;line-height:1.75&quot;&gt;前2小時按4/3、後4小時按5/3，以實際出勤時數計算。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:0 0 10px 0&quot;&gt;&lt;table width=&quot;100%&quot; role=&quot;presentation&quot; cellspacing=&quot;0&quot; cellpadding=&quot;0&quot; border=&quot;0&quot; style=&quot;width:100%;background:#f5f2fa;border:3px solid #ffffff;border-radius:16px&quot;&gt;&lt;tr&gt;&lt;td style=&quot;padding:17px 18px&quot;&gt;&lt;p style=&quot;margin:0 0 4px 0;color:#cbbbe3;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:14.5px;font-weight:800;letter-spacing:.7px&quot;&gt;國定假日出勤6小時&lt;/p&gt;&lt;p style=&quot;margin:0 0 5px 0;color:#443952;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:22px;font-weight:800;line-height:1.5&quot;&gt;合計 2,352 元&lt;/p&gt;&lt;p style=&quot;margin:0;color:#6b6174;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:14.5px;font-weight:500;line-height:1.75&quot;&gt;前提是該日原本是約定工作日，且國定假日沒有依法調移。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;

ne-height:1.75&quot;&gt;用實際時數重算一次&lt;/p&gt;&lt;p style=&quot;margin:0;color:#655a70;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:18.5px;font-weight:500;line-height:1.755&quot;&gt;休息日前2小時用時薪乘4/3，之後到第8小時用時薪乘5/3；國定假日8小時內原則上工資加倍。也可把資料輸入勞動部試算器。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td width=&quot;47&quot; valign=&quot;top&quot; style=&quot;width:47px;padding:9px 0&quot;&gt;&lt;table role=&quot;presentation&quot; cellspacing=&quot;0&quot; cellpadding=&quot;0&quot; border=&quot;0&quot;&gt;&lt;tr&gt;&lt;td align=&quot;center&quot; bgcolor=&quot;#cbbbe3&quot; style=&quot;width:34px;height:34px;background:#cbbbe3;border:3px solid #ffffff;border-radius:50%;color:#443952;font-family:Arial,sans-serif;font-size:14.5px;font-weight:800;line-height:34px&quot;&gt;03&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;td valign=&quot;top&quot; style=&quot;padding:9px 0&quot;&gt;&lt;p style=&quot;margin:0 0 3px 0;color:#443952;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:18.5px;font-weight:800;line-height:1.75&quot;&gt;書面詢問，必要時申訴&lt;/p&gt;&lt;p style=&quot;margin:0;color:#655a70;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:18.5px;font-weight:500;line-height:1.755&quot;&gt;先用文字列出日期、出勤時數、約定時薪、依法試算金額與實領差額，請雇主補發。未處理時，可打1955或向工作所在地勞工主管機關申訴。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;

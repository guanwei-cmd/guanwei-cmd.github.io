Hei',sans-serif;font-size:11px;font-weight:600;line-height:1.7&quot;&gt;夏月約1,395元，非夏月約1,220元，為基本電費分段試算。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:0 0 10px 0&quot;&gt;&lt;table width=&quot;100%&quot; role=&quot;presentation&quot; cellspacing=&quot;0&quot; cellpadding=&quot;0&quot; border=&quot;0&quot; style=&quot;width:100%;background:#f2eef9;border:3px solid #ffffff;border-radius:16px&quot;&gt;&lt;tr&gt;&lt;td style=&quot;padding:17px 18px&quot;&gt;&lt;p style=&quot;margin:0 0 4px 0;color:#654994;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:10px;font-weight:800;letter-spacing:.7px&quot;&gt;節電獎勵&lt;/p&gt;&lt;p style=&quot;margin:0 0 5px 0;color:#3e3a49;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:19px;font-weight:800;line-height:1.5&quot;&gt;每度 0.6 元&lt;/p&gt;&lt;p style=&quot;margin:0;color:#6b6174;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:11px;font-weight:600;line-height:1.7&quot;&gt;完成登錄後，符合節電條件的度數可依規定折抵當期電費。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;

ight:1.6&quot;&gt;按級距逐段相加&lt;/p&gt;&lt;p style=&quot;margin:0;color:#5f5869;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:12px;font-weight:600;line-height:1.75&quot;&gt;以500度為例：夏月為120度乘1.78元、210度乘2.55元、170度乘3.80元，合計約1,395元；非夏月同樣分段後約1,220元。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td width=&quot;47&quot; valign=&quot;top&quot; style=&quot;width:47px;padding:9px 0&quot;&gt;&lt;table role=&quot;presentation&quot; cellspacing=&quot;0&quot; cellpadding=&quot;0&quot; border=&quot;0&quot;&gt;&lt;tr&gt;&lt;td align=&quot;center&quot; bgcolor=&quot;#654994&quot; style=&quot;width:34px;height:34px;background:#654994;border:3px solid #ffffff;border-radius:50%;color:#ffffff;font-family:Arial,sans-serif;font-size:10px;font-weight:800;line-height:34px&quot;&gt;03&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;td valign=&quot;top&quot; style=&quot;padding:9px 0&quot;&gt;&lt;p style=&quot;margin:0 0 3px 0;color:#3e3a49;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:14px;font-weight:800;line-height:1.6&quot;&gt;先減少高級距用電&lt;/p&gt;&lt;p style=&quot;margin:0;color:#5f5869;font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:12px;font-weight:600;line-height:1.75&quot;&gt;冷氣溫度、濾網、除濕機與熱水設備最值得先檢查。若尚未登錄節電獎勵，可用電號到台電官方頁面申請。&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;
